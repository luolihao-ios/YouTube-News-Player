name: YouTubeNewsLive 三平台签名与商店资料

on:
  workflow_dispatch:
    inputs:
      operation:
        description: inspect/prepare 只读；metadata 填写资料；release 签名上传
        type: choice
        default: inspect
        options: [inspect, prepare, metadata, release]
      platform:
        description: 仅处理选定平台；all 不包含 tvOS
        type: choice
        default: all
        options: [all, ios, macos, visionos]

permissions:
  contents: read

concurrency:
  group: youtubenewslive-app-store
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.operation == 'release'
    uses: ./.github/workflows/ios.yml
    secrets: inherit

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      record_ready: ${{ steps.apple.outputs.record_ready }}
      app_id: ${{ steps.apple.outputs.app_id }}
      build_number: ${{ steps.apple.outputs.build_number }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT[crypto]==2.10.1'
      - name: 验证选定平台
        id: platforms
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,'scripts')
          import appstore
          appstore.output('platforms',json.dumps(appstore.selected_platforms([os.environ['SELECTED_PLATFORM']])))
          PY
      - name: 只读应用、全部平台草稿、语言与二进制
        id: apple
        run: python scripts/appstore.py inspect
      - name: 确认写入或发布具有实际应用记录
        if: steps.apple.outputs.record_ready != 'true' && (inputs.operation == 'metadata' || inputs.operation == 'release')
        run: |
          echo '没有本 Bundle 的 App Store Connect 记录，停止资料写入或上传。'
          exit 1
      - name: 填写并回读所选平台三语言商店资料
        if: steps.apple.outputs.record_ready == 'true' && (inputs.operation == 'metadata' || inputs.operation == 'release')
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: python scripts/appstore.py metadata --platform "$SELECTED_PLATFORM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YouTubeNewsLive-Apple-商店报告
          path: build/apple-report
          if-no-files-found: ignore
          retention-days: 7

  archive-upload:
    needs: [verify, prepare]
    if: inputs.operation == 'release' && needs.prepare.outputs.record_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.luolihao.newslive
      APP_STORE_ID: ${{ needs.prepare.outputs.app_id }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      RELEASE_STAGE: testflight
      IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
      IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
      MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      SUPPORT_URL: ${{ vars.SUPPORT_URL }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT[crypto]==2.10.1'
      - name: 检查证书、签名、验证 IPA 或 PKG 并上传
        env:
          SELECTED_PLATFORM: ${{ matrix.platform }}
        run: python scripts/apple_release.py --platform "$SELECTED_PLATFORM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YouTubeNewsLive-${{ matrix.platform }}-签名成品与上传报告
          path: |
            build/export/${{ matrix.platform }}
            build/apple-report
          if-no-files-found: ignore
          retention-days: 7
